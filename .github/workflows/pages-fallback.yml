name: C Scale - Backup de publicação Supabase
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'fixtures/**'
      - 'preview/**'
      - '.github/workflows/pages-fallback.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cscale-static-publish
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --ignore-scripts && npm install --no-save --no-audit vite@7.1.11
      - name: Construir versão estática
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://trdxtrhpvwiihgowbdzs.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Afmc0YdtaNvpircrbJPGlw_w_Quqh_L
        run: ./node_modules/.bin/vite build --config preview/vite.config.mjs
      - name: Publicar arquivos em branch própria
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist-pages
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b cscale-static
          git add -A
          git commit -m "C Scale estatico - $GITHUB_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force https://github.com/$GITHUB_REPOSITORY.git HEAD:refs/heads/cscale-static
