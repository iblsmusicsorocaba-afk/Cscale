name: C Scale — Publicar versão alternativa
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'fixtures/**'
      - 'preview/**'
      - '.github/workflows/pages-fallback.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-cscale-preview
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --ignore-scripts && npm install --no-save --no-audit vite@7.1.11
      - name: Construir versão estática alternativa
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://trdxtrhpvwiihgowbdzs.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Afmc0YdtaNvpircrbJPGlw_w_Quqh_L
        run: ./node_modules/.bin/vite build --config preview/vite.config.mjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
